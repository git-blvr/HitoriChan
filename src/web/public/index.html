<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HitoriChan Dashboard — Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-bg"></div>
    <div class="login-form-box">
      <div class="login-card">
        <h1>Hitori Chan</h1>
        <p class="login-subtitle">Bot Dashboard</p>
        <form id="login-form" class="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" value="Admin" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="6-digit code from console" autocomplete="current-password" required />
          <button type="submit" class="login-btn">Login</button>
        </form>
        <p id="login-error" class="login-error" hidden></p>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/login.js"></script>
</body>
</html>
