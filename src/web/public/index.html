<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <title>HitoriChan — Sign in</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/ui.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-bg"></div>
    <div class="login-form-box">
      <div class="login-card">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span class="brand-text">
            <span class="brand-name">HitoriChan</span>
            <span class="brand-sub">Control center</span>
          </span>
        </div>
        <h1>Sign in</h1>
        <p class="login-subtitle">Continue with the Discord account that owns a server running HitoriChan.</p>
        <a class="login-discord" id="discord-login" href="/auth/discord" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.577 4.37a.07.07 0 0 0-.032.027C.532 9.046-.32 13.58.098 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Sign in with Discord
        </a>
        <p class="login-note" id="discord-note" hidden>Access is granted for servers you own where the bot is present.</p>
        <details class="login-local" id="login-local">
          <summary>Use a dashboard account</summary>
          <form id="login-form" class="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" placeholder="Insert your password here." autocomplete="current-password" required />
              <button type="button" class="toggle-password" id="toggle-password" title="Show password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <button type="submit" class="login-btn">Sign in</button>
          </form>
        </details>
        <p id="login-error" class="login-error" hidden></p>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/login.js"></script>
</body>
</html>
