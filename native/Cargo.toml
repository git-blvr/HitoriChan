[package]
name = "hitori_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gif = "0.13"
imagequant = "4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
